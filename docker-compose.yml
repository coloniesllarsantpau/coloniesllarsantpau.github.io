services:
  build:
    build: .
    # Amb la versió de Node a l'etiqueta: amb una etiqueta fixa, compose reaprofitaria una imatge antiga sense reconstruir-la.
    image: llar-sant-pau-build:26.13.0
    user: '${HOST_UID:-1000}:${HOST_GID:-1000}'
    working_dir: /app
    environment:
      HOME: /tmp
    volumes:
      - .:/app
    command: sh -c "npm ci && npm run lint && npm run generate"
    profiles: ['build']

  web:
    image: nginx:alpine
    ports:
      - '127.0.0.1:8081:80'
    volumes:
      - ./docs:/usr/share/nginx/html:ro

  # Servidors que imiten GitHub Pages, només per a la validació (scripts/valida.sh).
  pages:
    image: nginx:alpine
    volumes:
      - ./docs:/usr/share/nginx/html:ro
      - ./tests/validacio/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    profiles: ['validacio']

  referencia:
    image: nginx:alpine
    volumes:
      - ./.referencia:/usr/share/nginx/html:ro
      - ./tests/validacio/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    profiles: ['validacio']

  playwright:
    image: mcr.microsoft.com/playwright:v1.49.1-jammy
    user: '${HOST_UID:-1000}:${HOST_GID:-1000}'
    working_dir: /tmp
    environment:
      HOME: /tmp
      BASE_URL: http://pages
      REF_URL: http://referencia
    volumes:
      - ./tests/validacio:/work:ro
      # Per a la comparació de fitxers públics (fitxers.spec.js).
      - ./docs:/fitxers/nova:ro
      - ./.referencia:/fitxers/referencia:ro
    depends_on:
      - pages
      - referencia
    # Es treballa en una còpia dins del contenidor: tests/validacio/ es munta només de lectura i el seu
    # node_modules no queda dins del repo.
    command: sh -c "cp -r /work /tmp/validacio && cd /tmp/validacio && npm ci && npx playwright test"
    profiles: ['validacio']
