services:
  build:
    build: .
    image: llar-sant-pau-build
    user: '${HOST_UID:-1000}:${HOST_GID:-1000}'
    working_dir: /app
    environment:
      HUSKY: '0'
      HOME: /tmp
    volumes:
      - .:/app
    command: sh -c "npm ci && npm run lint && npm test && npm run generate"
    profiles: ['build']

  # Web nova (app-nou/). node_modules, .nuxt i .output són volums amb nom: mai dins del repo.
  permisos-nou:
    image: node:26.13.0-bookworm
    user: root
    command: chown ${HOST_UID:-1000}:${HOST_GID:-1000} /app/node_modules /app/.nuxt /app/.output
    volumes:
      - nou-node-modules:/app/node_modules
      - nou-nuxt:/app/.nuxt
      - nou-output:/app/.output
    profiles: ['build-nou']

  build-nou:
    image: node:26.13.0-bookworm
    user: '${HOST_UID:-1000}:${HOST_GID:-1000}'
    working_dir: /app
    environment:
      HOME: /tmp
    volumes:
      - ./app-nou:/app
      - nou-node-modules:/app/node_modules
      - nou-nuxt:/app/.nuxt
      - nou-output:/app/.output
    depends_on:
      permisos-nou:
        condition: service_completed_successfully
    command: sh -c "npm ci && npm run lint && npm run generate"
    profiles: ['build-nou']

  web:
    image: nginx:alpine
    ports:
      - '127.0.0.1:8081:80'
    volumes:
      - ./docs:/usr/share/nginx/html:ro

  # Servidors que imiten GitHub Pages, només per a la validació (scripts/valida.sh).
  pages:
    image: nginx:alpine
    ports:
      - '127.0.0.1:8082:80'
    volumes:
      - ${DOCS_DIR:-./docs}:/usr/share/nginx/html:ro
      - ./tests/validacio/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    profiles: ['validacio']

  referencia:
    image: nginx:alpine
    volumes:
      - ./.referencia:/usr/share/nginx/html:ro
      - ./tests/validacio/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    profiles: ['validacio']

  playwright:
    image: mcr.microsoft.com/playwright:v1.49.1-jammy
    user: '${HOST_UID:-1000}:${HOST_GID:-1000}'
    working_dir: /tmp
    environment:
      HOME: /tmp
      BASE_URL: http://pages
      REF_URL: http://referencia
      VALIDA_NOU: '${VALIDA_NOU:-}'
      PW_ARGS: '${PW_ARGS:-}'
    volumes:
      - ./tests/validacio:/work:ro
      # Per a la comparació de fitxers públics (fitxers.spec.js).
      - ${DOCS_DIR:-./docs}:/fitxers/nova:ro
      - ./.referencia:/fitxers/referencia:ro
    depends_on:
      - pages
      - referencia
    # Es treballa en una còpia fora del repo: si node_modules fos dins del repo, el build de Nuxt
    # (que recorre l'arrel del projecte) l'inclouria al bundle.
    command: sh -c "cp -r /work /tmp/validacio && cd /tmp/validacio && npm ci && npx playwright test $$PW_ARGS"
    profiles: ['validacio']

volumes:
  nou-node-modules:
  nou-nuxt:
  nou-output:
