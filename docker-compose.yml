services:
  build:
    build: .
    image: llar-sant-pau-build
    user: '${HOST_UID:-1000}:${HOST_GID:-1000}'
    working_dir: /app
    environment:
      HUSKY: '0'
      HOME: /tmp
    volumes:
      - .:/app
    command: sh -c "npm ci && npm run generate"
    profiles: ['build']

  web:
    image: nginx:alpine
    ports:
      - '127.0.0.1:8081:80'
    volumes:
      - ./docs:/usr/share/nginx/html:ro

  # Servidors que imiten GitHub Pages, només per a la validació (scripts/valida.sh).
  pages:
    image: nginx:alpine
    ports:
      - '127.0.0.1:8082:80'
    volumes:
      - ./docs:/usr/share/nginx/html:ro
      - ./tests/validacio/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    profiles: ['validacio']

  referencia:
    image: nginx:alpine
    volumes:
      - ./.referencia:/usr/share/nginx/html:ro
      - ./tests/validacio/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    profiles: ['validacio']

  playwright:
    image: mcr.microsoft.com/playwright:v1.49.1-jammy
    user: '${HOST_UID:-1000}:${HOST_GID:-1000}'
    working_dir: /tmp
    environment:
      HOME: /tmp
      BASE_URL: http://pages
      REF_URL: http://referencia
    volumes:
      - ./tests/validacio:/work:ro
    depends_on:
      - pages
      - referencia
    # Es treballa en una còpia fora del repo: si node_modules fos dins del repo, el build de Nuxt
    # (que recorre l'arrel del projecte) l'inclouria al bundle.
    command: sh -c "cp -r /work /tmp/validacio && cd /tmp/validacio && npm ci && npx playwright test"
    profiles: ['validacio']
