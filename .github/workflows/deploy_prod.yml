name: Deploy Prod

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [26.13.0]

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup node env 🏗
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies 👨🏻‍💻
        run: npm ci --prefer-offline --no-audit

      - name: Run linter 👀
        run: npm run lint

      - name: Generate 📦
        run: npm run generate

      - name: Check output ✅
        run: |
          [ -f docs/CNAME ] || { echo "falta docs/CNAME"; exit 1; }
          [ "$(tr -d '\n' < docs/CNAME)" = "coloniesllarsantpau.com" ] || { echo "docs/CNAME no conté el domini esperat"; exit 1; }
          [ -f docs/200.html ] || { echo "falta docs/200.html"; exit 1; }
          [ -f docs/index.html ] || { echo "falta docs/index.html"; exit 1; }
          for route in lacasa serveis excursions fotos collaboradors contacte; do
            [ -f "docs/$route/index.html" ] || { echo "falta docs/$route/index.html"; exit 1; }
          done
          size_kb=$(du -sk docs | cut -f1)
          [ "$size_kb" -lt $((1024 * 1024)) ] || { echo "docs pesa ${size_kb} KB (límit 1 GB)"; exit 1; }

      - name: Upload output 📤
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs
          path: docs
          if-no-files-found: error

  deploy:
    needs: build
    permissions:
      contents: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Download output 📥
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs
          path: docs

      - name: Deploy 📦
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
