# Imita el comportament de GitHub Pages per a aquesta web:
# /ruta fa 301 a /ruta/, les rutes inexistents retornen 404 i no hi ha regles pròpies.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Redirecció relativa: no depèn del host ni del port.
    absolute_redirect off;

    location / {
        try_files $uri $uri/ =404;
    }
}
